plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mondaro.easytopup'
    compileSdk 35

    defaultConfig {
        applicationId "com.mondaro.easytopup"
        // Android 5.0 Lollipop. Covers virtually every device still in service
        // while allowing modern AndroidX artifacts and the Java 8+ language level.
        minSdk 21
        targetSdk 35
        versionCode 48
        versionName "7.0"
        vectorDrawables.useSupportLibrary = true
        resourceConfigurations += ["th", "en"]
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ["META-INF/*.kotlin_module", "DebugProbesKt.bin"]
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.fragment:fragment:1.8.3'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'com.google.android.material:material:1.12.0'
    // Encrypted storage for the agent PIN. Falls back gracefully at runtime on
    // devices whose keystore is broken (see SecurePrefs).
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
